name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # Testcontainers (SQL Server + Azurite) use the runner's Docker; CI=true makes missing Docker a failure, not a skip.
      - run: dotnet test -c Release --no-build --report-xunit-trx --results-directory ${{ github.workspace }}/TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: TestResults
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Building the API regenerates the committed OpenAPI document; the TS schema is regenerated from it.
      - run: dotnet build src/RunnersDiary.Api
      - run: npm --prefix web ci
      - run: npm --prefix web run generate:api
      - name: Fail if the committed contract or generated client is stale
        run: |
          changes="$(git status --porcelain -- src/RunnersDiary.Api/openapi web/src/api/generated)"
          if [ -n "$changes" ]; then
            echo "::error::OpenAPI document or generated TS client is stale. Run: dotnet build src/RunnersDiary.Api && npm --prefix web run generate:api"
            echo "$changes"
            git diff -- src/RunnersDiary.Api/openapi web/src/api/generated
            exit 1
          fi
