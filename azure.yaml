# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# azd project (ADR 0030). Used from a laptop only: `azd provision` (user-confirmed, plan gates G1/G2) and `azd down`.
# Normal code deploys go through .github/workflows/deploy.yml (migrate job first, smoke test, rollback).
name: runners-diary

infra:
  provider: bicep
  path: infra
  module: main

services:
  api:
    project: ./src/RunnersDiary.Api
    language: dotnet
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../../
  web:
    project: ./web
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

hooks:
  preprovision:
    shell: sh
    run: sh infra/hooks/preprovision.sh
  postprovision:
    shell: sh
    run: sh infra/hooks/postprovision.sh
  predown:
    shell: sh
    run: sh infra/hooks/predown.sh
